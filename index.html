<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>城签 · City Sign</title>
<style>
:root{
  --ink:#23282d; --muted:#6d747b; --faint:#9aa1a7; --line:#e6e2da;
  --paper:#fbf9f4; --card:#ffffff; --accent:#a9553d; --accent-soft:#f4e9e3;
  --sage:#5d7568; --gold:#b8975a; --shadow:0 18px 48px rgba(43,38,32,.10);
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:#efece5;color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.6}

/* ---------- 控制条 ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:rgba(251,249,244,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 22px;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:2px;white-space:nowrap}
.brand span{color:var(--accent)}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:360px}
.search-wrap input{width:100%;padding:9px 34px 9px 13px;border:1px solid var(--line);
  border-radius:9px;background:#fff;font-size:13px;outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(93,117,104,.10)}
.search-wrap .clear{position:absolute;right:9px;top:7px;border:0;background:none;
  color:var(--faint);cursor:pointer;font-size:16px;line-height:1}
.picker{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:30;background:#fff;
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  max-height:340px;overflow:auto;padding:5px}
.picker[hidden]{display:none}
.picker .grp{font-size:10.5px;color:var(--faint);letter-spacing:2px;padding:7px 9px 3px}
.picker button{display:flex;justify-content:space-between;align-items:center;width:100%;
  border:0;background:none;padding:7px 9px;border-radius:6px;cursor:pointer;text-align:left;
  font-family:inherit;font-size:13px;color:var(--ink)}
.picker button:hover,.picker button.on{background:var(--accent-soft);color:var(--accent)}
.picker button small{color:var(--faint);font-size:11px}
.tool-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;
  cursor:pointer;font-size:12.5px;font-family:inherit;color:var(--ink);white-space:nowrap}
.tool-btn:hover{border-color:var(--sage);color:var(--sage)}
.tool-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.tool-btn.primary:hover{background:var(--sage);border-color:var(--sage)}
.tool-btn.icon{font-size:15px;padding:7px 10px}
.lang-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang-toggle button{border:0;background:#fff;padding:8px 12px;cursor:pointer;
  font-size:12px;font-family:inherit;color:var(--muted)}
.lang-toggle button.on{background:var(--ink);color:#fff}
.tool-sep{width:1px;height:26px;background:var(--line);margin:0 2px}
.export-menu{position:relative}
.export-pop{position:absolute;top:calc(100% + 5px);right:0;z-index:30;background:#fff;
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:180px}
.export-pop[hidden]{display:none}
.export-pop button{display:block;width:100%;border:0;background:none;padding:9px 12px;
  border-radius:6px;cursor:pointer;text-align:left;font-family:inherit;font-size:12.5px;color:var(--ink)}
.export-pop button:hover{background:var(--accent-soft);color:var(--accent)}

/* ---------- 城签卡片 ---------- */
.stage{padding:26px 18px 60px;display:flex;justify-content:center}
.sign{width:760px;max-width:100%;background:var(--card);border-radius:18px;overflow:hidden;
  box-shadow:var(--shadow);position:relative}
.hero{position:relative;height:338px;background:#d8d5cd;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .5s,filter .7s}
.hero .fallback{position:absolute;inset:0;display:none}
.hero::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(20,24,27,.34) 0%,rgba(20,24,27,.02) 38%,
  rgba(20,24,27,.10) 66%,rgba(20,24,27,.58) 100%)}
/* 皮肤：仅用滤镜与色调，界面不显示样式名 */
.hero.skin-warm img{filter:saturate(1.12) sepia(.10) contrast(1.03)}
.hero.skin-cool img{filter:saturate(.9) hue-rotate(-12deg) brightness(1.02)}
.hero.skin-dusk img{filter:saturate(1.05) sepia(.22) brightness(.9) contrast(1.08)}
.hero.skin-night img{filter:saturate(.8) brightness(.6) contrast(1.15) hue-rotate(8deg)}
.hero.skin-film img{filter:grayscale(.35) sepia(.18) contrast(1.05)}
.hero.skin-vivid img{filter:saturate(1.35) contrast(1.06) brightness(1.02)}
.hero.skin-dawn img{filter:saturate(.95) brightness(1.12) hue-rotate(6deg)}
.hero-top{position:absolute;top:18px;left:22px;right:22px;z-index:2;display:flex;
  justify-content:space-between;align-items:flex-start;color:#fff}
.coord-chip{font-size:11.5px;letter-spacing:1px;background:rgba(20,24,27,.42);
  border:1px solid rgba(255,255,255,.36);padding:6px 11px;border-radius:20px;
  backdrop-filter:blur(6px);font-variant-numeric:tabular-nums;cursor:pointer;user-select:none}
.coord-chip:hover{background:rgba(20,24,27,.62)}
.issue{font-family:var(--serif);font-size:11px;letter-spacing:2px;text-align:right;
  text-shadow:0 1px 4px rgba(0,0,0,.4)}
.hero-bottom{position:absolute;left:30px;right:30px;bottom:22px;z-index:2;color:#fff}
.kicker{font-size:11px;letter-spacing:3px;opacity:.9;margin:0 0 5px}
.city-name{font-family:var(--serif);font-size:46px;line-height:1.1;margin:0;font-weight:700;
  letter-spacing:3px;text-shadow:0 2px 14px rgba(0,0,0,.30)}
.city-name .en{font-family:Georgia,serif;font-size:20px;font-weight:400;letter-spacing:1px;
  margin-left:13px;opacity:.94}
.city-sub{margin:7px 0 0;font-size:12.5px;opacity:.94;letter-spacing:.5px}
.skin-btn{position:absolute;right:22px;bottom:20px;z-index:3;width:34px;height:34px;
  border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(20,24,27,.35);
  color:#fff;font-size:15px;cursor:pointer;backdrop-filter:blur(6px);display:flex;
  align-items:center;justify-content:center;transition:transform .3s,background .2s}
.skin-btn:hover{background:rgba(20,24,27,.6);transform:rotate(40deg)}

/* ---------- 信息区 ---------- */
.content{padding:26px 32px 30px}
.now-strip{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;background:var(--paper)}
.now-cell{flex:1;padding:13px 17px;min-width:0}
.now-cell + .now-cell{border-left:1px solid var(--line)}
.now-label{font-size:10px;color:var(--faint);letter-spacing:2px;margin:0 0 4px}
.now-value{font-size:22px;font-weight:600;margin:0;font-variant-numeric:tabular-nums;line-height:1.25}
.now-value small{font-size:12px;font-weight:400;color:var(--muted);margin-left:3px}
.now-note{font-size:11px;color:var(--muted);margin:3px 0 0}
.wx-icon{font-size:24px;margin-right:6px;vertical-align:-2px}

.sec{margin-top:23px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2.5px;
  color:var(--accent);margin:0 0 11px;font-weight:600}
.sec-title::after{content:"";height:1px;background:var(--line);flex:1}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
.fact-l{font-size:10.5px;color:var(--faint);letter-spacing:1px;margin:0 0 2px}
.fact-v{font-size:14px;font-weight:500;margin:0;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{font-size:12px;padding:6px 11px;border-radius:20px;background:var(--paper);
  border:1px solid var(--line);color:var(--ink)}
.tag.food{background:#f6f1e9;border-color:#eadfcf;color:#8a6a3f}

/* 世界位置小地图 */
.loc-map{display:flex;gap:14px;align-items:stretch;margin-top:2px;
  border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.loc-map .map-box{flex:none;width:236px;padding:8px}
.loc-map .map-box svg{display:block;width:100%;height:auto;border-radius:6px}
.loc-map .map-info{flex:1;padding:13px 14px 12px 4px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.loc-l{font-size:10px;color:var(--faint);letter-spacing:2px;margin:0 0 3px}
.loc-v{font-size:15px;font-weight:600;margin:0 0 9px;line-height:1.4;font-variant-numeric:tabular-nums}
.loc-tz{display:inline-block;font-size:11px;background:#eef2ee;color:var(--sage);
  border:1px solid #d9e3da;border-radius:6px;padding:3px 8px;margin-top:1px}
.loc-note{font-size:10px;color:var(--faint);margin:9px 0 0;line-height:1.5}
.map-tz-label{font-family:var(--sans);font-weight:600}

.quote{margin:24px 0 0;padding:17px 20px 15px;background:linear-gradient(135deg,#faf6f0,#f6f1e9);
  border-left:3px solid var(--accent);border-radius:0 10px 10px 0;position:relative}
.quote p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.8;color:#3b342c;
  padding-right:66px}
.quote .author{margin-top:8px;font-size:11.5px;color:var(--muted);letter-spacing:.5px}
.quote .en-line{margin-top:9px;padding-top:9px;border-top:1px dashed #e3d9cc;
  font-family:Georgia,serif;font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.6}
.quote .kind{display:inline-block;font-size:10px;color:var(--accent);background:var(--accent-soft);
  border-radius:4px;padding:2px 7px;margin-right:8px;vertical-align:1px}
.quote-nav{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px}
.quote-nav button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
  background:#fff;cursor:pointer;color:var(--muted);font-size:13px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.quote-nav button:hover{border-color:var(--accent);color:var(--accent)}
.quote-nav .qcount{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;
  margin-top:24px;padding-top:13px;border-top:1px solid var(--line);
  font-size:10.5px;color:var(--faint);line-height:1.55}
.foot .src{max-width:62%}
.hint{text-align:center;color:var(--muted);font-size:11.5px;margin:18px 0 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:700px){
  .toolbar{padding:10px 13px}.brand{font-size:16px}
  .stage{padding:14px 10px 40px}
  .hero{height:268px}.city-name{font-size:34px}.city-name .en{font-size:15px;display:block;margin:4px 0 0}
  .content{padding:20px 18px 24px}
  .facts{grid-template-columns:repeat(2,1fr)}
  .now-value{font-size:18px}
  .loc-map{flex-direction:column}.loc-map .map-box{width:100%}.loc-map .map-info{padding:4px 14px 12px}
}
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff}
  .toolbar,.hint,.skin-btn,.quote-nav,.toast{display:none!important}
  .stage{padding:0}
  .sign{width:100%;box-shadow:none;border-radius:0}
  .hero{height:88mm}
  .content{padding:7mm 8mm}
  .now-strip,.quote,.tag,.fact-v,.loc-map,.map-tz-label{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hero,.hero::after,.hero img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">城<span>签</span> <small style="font-size:11px;color:#9aa1a7;letter-spacing:1px">CITY SIGN</small></div>
  <div class="search-wrap">
    <input id="search" type="text" autocomplete="off" placeholder="搜索城市 / Search city…" aria-label="搜索城市">
    <button class="clear" id="clear" title="清除">×</button>
    <div class="picker" id="picker" hidden></div>
  </div>
  <button class="tool-btn" id="randomBtn" data-zh="随机一城" data-en="Surprise me">随机一城</button>
  <div class="lang-toggle">
    <button id="langZh" class="on">中文</button><button id="langEn">EN</button>
  </div>
  <div class="tool-sep"></div>
  <div class="export-menu">
    <button class="tool-btn primary" id="exportBtn" data-zh="导出 ▾" data-en="Export ▾">导出 ▾</button>
    <div class="export-pop" id="exportPop" hidden>
      <button id="expHtml" data-zh="导出单文件 HTML（自包含）" data-en="Export standalone HTML">导出单文件 HTML（自包含）</button>
      <button id="expPng" data-zh="导出 PNG 图片" data-en="Export PNG image">导出 PNG 图片</button>
      <button id="expPdf" data-zh="打印 / 存为 PDF" data-en="Print / Save PDF">打印 / 存为 PDF</button>
    </div>
  </div>
</div>

<div class="stage">
<article class="sign" id="sign">
  <div class="hero" id="hero">
    <img id="heroImg" alt="城市实景">
    <div class="fallback" id="fallback"></div>
    <div class="hero-top">
      <div class="coord-chip" id="coord">—</div>
      <div class="issue" id="issue">CITY SIGN · —</div>
    </div>
    <div class="hero-bottom">
      <p class="kicker" id="kicker">CITY SIGN</p>
      <h1 class="city-name"><span id="cityName">北京</span><span class="en" id="cityEn">Beijing</span></h1>
      <p class="city-sub" id="citySub">—</p>
    </div>
    <button class="skin-btn" id="skinBtn" title="切换背景皮肤">◐</button>
  </div>

  <div class="content">
    <div class="now-strip">
      <div class="now-cell">
        <p class="now-label" data-zh="此刻天气 · WEATHER NOW" data-en="WEATHER NOW">此刻天气 · WEATHER NOW</p>
        <p class="now-value"><span class="wx-icon" id="wxIcon">◌</span><span id="wxTemp">—</span></p>
        <p class="now-note" id="wxNote">—</p>
      </div>
      <div class="now-cell">
        <p class="now-label" data-zh="当地时间 · LOCAL TIME" data-en="LOCAL TIME">当地时间 · LOCAL TIME</p>
        <p class="now-value" id="localTime">—</p>
        <p class="now-note" id="localDate">—</p>
      </div>
      <div class="now-cell">
        <p class="now-label" data-zh="今日日照 · SUN" data-en="SUN TODAY">今日日照 · SUN</p>
        <p class="now-value" id="sunTime">—</p>
        <p class="now-note" id="sunNote">—</p>
      </div>
    </div>

    <section class="sec">
      <p class="sec-title" data-zh="世界位置 · WHERE ON EARTH" data-en="WHERE ON EARTH">世界位置 · WHERE ON EARTH</p>
      <div class="loc-map">
        <div class="map-box" id="mapBox"></div>
        <div class="map-info">
          <p class="loc-l" data-zh="经纬度 · COORDINATES" data-en="COORDINATES">经纬度 · COORDINATES</p>
          <p class="loc-v" id="mapCoord">—</p>
          <p class="loc-l" data-zh="时区 · TIME ZONE" data-en="TIME ZONE">时区 · TIME ZONE</p>
          <span class="loc-tz" id="mapTz">—</span>
          <p class="loc-note" id="mapNote">—</p>
        </div>
      </div>
    </section>

    <section class="sec">
      <p class="sec-title" data-zh="城市档案 · CITY FACTS" data-en="CITY FACTS">城市档案 · CITY FACTS</p>
      <div class="facts" id="facts"></div>
    </section>

    <section class="sec">
      <p class="sec-title" data-zh="地标与风味 · SIGHTS &amp; FLAVOURS" data-en="SIGHTS &amp; FLAVOURS">地标与风味 · SIGHTS &amp; FLAVOURS</p>
      <div class="tags" id="sights"></div>
      <div class="tags" id="foods" style="margin-top:9px"></div>
    </section>

    <blockquote class="quote" id="quoteBox">
      <div class="quote-nav">
        <button id="quotePrev" title="上一条">‹</button>
        <span class="qcount" id="quoteCount">1/1</span>
        <button id="quoteNext" title="下一条">›</button>
      </div>
      <p><span class="kind" id="quoteKind">名言</span><span id="quoteText">—</span></p>
      <div class="author" id="quoteAuthor">—</div>
      <div class="en-line" id="quoteEn" hidden></div>
    </blockquote>
  </div>
</article>
</div>
<div class="toast" id="toast"></div>

/* ---------- 语言 ---------- */
function t(el, zh, en){ el.textContent = isZh() ? zh : en; }
function applyStaticLang(){
  document.documentElement.lang = isZh() ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-zh]').forEach(el => {
    el.textContent = isZh() ? el.dataset.zh : el.dataset.en;
  });
  $('langZh').classList.toggle('on', isZh());
  $('langEn').classList.toggle('on', !isZh());
  $('search').placeholder = isZh() ? '搜索城市 / Search city…' : 'Search city / 搜索城市…';
}
$('langZh').onclick = () => { lang='zh'; localStorage.setItem('citysign-lang',lang); applyStaticLang(); render(); };
$('langEn').onclick = () => { lang='en'; localStorage.setItem('citysign-lang',lang); applyStaticLang(); render(); };

function fmtCoord(c, style){
  const st = style || coordStyle;
  const lat = Math.abs(c.lat).toFixed(2), lon = Math.abs(c.lon).toFixed(2);
  if(st === 'symbols'){
    return `${lat}°${c.lat>=0?'N':'S'} · ${lon}°${c.lon>=0?'E':'W'}`;
  }
  return isZh()
    ? `${c.lat>=0?'北纬':'南纬'} ${lat}° · ${c.lon>=0?'东经':'西经'} ${lon}°`
    : `${c.lat>=0?'Lat ':'Lat -'}${lat}° · ${c.lon>=0?'Lon ':'Lon -'}${lon}°`;
}

function fmtPop(c){ return isZh() ? `约 ${c.popWan.toLocaleString('zh-CN')} 万` : `≈ ${(c.popWan/100).toFixed(1)}M`; }
function fmtArea(c){ return isZh() ? `约 ${c.areaKm2.toLocaleString('zh-CN')} km²` : `≈ ${c.areaKm2.toLocaleString('en-US')} km²`; }
function hemi(c){
  const a = isZh() ? (c.lat>=0?'北半球':'南半球') : (c.lat>=0?'N. Hemisphere':'S. Hemisphere');
  const b = isZh() ? (c.lon>=0?'东半球':'西半球') : (c.lon>=0?'E. Hemisphere':'W. Hemisphere');
  return a + ' · ' + b;
}
function offsetOf(tz){
  try {
    const parts = new Intl.DateTimeFormat('en',{timeZone:tz,timeZoneName:'shortOffset'}).formatToParts(new Date());
    const p = parts.find(x=>x.type==='timeZoneName');
    return p ? p.value.replace('GMT','UTC') : tz;
  } catch(e){ return tz; }
}
function localClock(tz, withDate){
  const d = new Date();
  const time = new Intl.DateTimeFormat(isZh()?'zh-CN':'en-GB',
    {timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  if(!withDate) return time;
  const date = new Intl.DateTimeFormat(isZh()?'zh-CN':'en-GB',
    {timeZone:tz,year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);
  return date + ' · ' + time;
}
function issueNo(c, d){
  const ymd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  return `No.${c.id.slice(0,3).toUpperCase()}-${ymd}`;
}

function cityButton(c){
  return `<button data-id="${c.id}" class="${c.id===current.id?'on':''}">
    <span>${isZh()?c.zh+' <small>'+c.en+'</small>':c.en+' <small>'+c.zh+'</small>'}</span>

function bindPicker(box){
  box.hidden = false;
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    selectCity(b.dataset.id); box.hidden = true; $('search').value='';
  });
}
function renderPicker(query){
  const q = (query||'').trim().toLowerCase();
  const list = CITIES.filter(c => !q ||
    c.zh.toLowerCase().includes(q) || c.en.toLowerCase().includes(q) ||
    c.countryZh.includes(q) || c.countryEn.toLowerCase().includes(q) ||
    c.nickname.includes(q) || c.tags.some(t=>t.includes(q)) ||
    c.landmarks.some(l=>l.includes(q)));
  const box = $('picker');
  if(!list.length){ box.hidden = true; return; }
  if(q){
    box.innerHTML = `<div class="grp">${isZh()?'匹配城市 · MATCHING CITIES':'MATCHING CITIES'} (${list.length})</div>` +
      list.slice(0,60).map(cityButton).join('');
  }else{
    const groups = {};
    list.forEach(c=>{ const key = isZh()?c.continent:c.continentEn; (groups[key]=groups[key]||[]).push(c); });
    box.innerHTML = Object.entries(groups).map(([g,cs])=>
      `<div class="grp">${g} · ${cs.length}</div>` + cs.map(cityButton).join('')).join('');
  }
  bindPicker(box);
}

function setImage(c){
  const img = $('heroImg');
  const src = `assets/cities/${c.id}.jpg`;
  img.onerror = ()=>{ img.style.display='none'; img.style.opacity='0'; $('fallback').style.display='block'; };
  img.onload = ()=>{ img.style.display='block'; img.style.opacity='1'; $('fallback').style.display='none'; };
  img.style.display='block'; img.style.opacity='0';
  img.src = src;
  renderFallback(c);
  pickSkin(); // 每次换城随机换肤
}
function pickSkin(){
  const hero = $('hero');
  let pool = SKINS.slice();
  // 依据此刻天气挑选候选：晴/暖、雨雾/冷、夜/暗
  if(wx){
    const code = wx.weather_code;
    const hour = parseInt(localClock(current.tz,false).slice(0,2),10);
    if(hour<=5 || hour>=19) pool=['skin-night','skin-dusk','skin-cool'];
    else if(code>=51 && code<=67) pool=['skin-cool','skin-film','skin-dawn'];
    else if(code>=71) pool=['skin-cool','skin-dawn','skin-film'];
    else if(code>=45 && code<=48) pool=['skin-film','skin-cool','skin-dawn'];
    else if(code===0 || code===1) pool=['skin-warm','skin-vivid','skin-dawn','skin-dusk'];
  }
  let pick = pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1 && pick===hero.dataset.skin){
    pick = pool[(pool.indexOf(pick)+1)%pool.length];
  }
  hero.dataset.skin = pick;
  hero.className = 'hero ' + pick;
}

/* ---------- 天气 ---------- */
const WMO = {
 0:['晴','Clear'],1:['大部晴朗','Mainly clear'],2:['局部多云','Partly cloudy'],3:['阴','Overcast'],
 45:['有雾','Foggy'],48:['雾凇','Rime fog'],51:['毛毛雨','Light drizzle'],53:['毛毛雨','Drizzle'],
 55:['浓毛毛雨','Dense drizzle'],56:['冻毛毛雨','Freezing drizzle'],57:['冻毛毛雨','Freezing drizzle'],
 61:['小雨','Light rain'],63:['中雨','Moderate rain'],65:['大雨','Heavy rain'],
 66:['冻雨','Freezing rain'],67:['冻雨','Freezing rain'],71:['小雪','Light snow'],
 73:['中雪','Moderate snow'],75:['大雪','Heavy snow'],77:['雪粒','Snow grains'],
 80:['阵雨','Rain showers'],81:['强阵雨','Heavy showers'],82:['暴雨','Violent showers'],
 85:['阵雪','Snow showers'],86:['强阵雪','Heavy snow showers'],95:['雷暴','Thunderstorm'],
 96:['雷暴伴冰雹','Thunderstorm, hail'],99:['雷暴伴大雹','Thunderstorm, heavy hail']
};
function wxIcon(code){
  if(code===0||code===1) return '☀️';
  if(code===2||code===3) return '⛅';
  if(code>=45&&code<=48) return '🌫️';
  if(code>=51&&code<=67||code>=80&&code<=82) return '🌧️';
  if(code>=71&&code<=77||code>=85&&code<=86) return '❄️';
  if(code>=95) return '⛈️';
  return '🌡️';
}
async function fetchWeather(c){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}`+
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m`+
    `&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
  try{
    const res = await fetch(url);
    const d = await res.json();
    if(!d.current) throw new Error('no current');
    wx = d.current; sun = d.daily;
    renderWeather(c); pickSkin();
  }catch(e){ wx=null; sun=null; renderWeather(c); }
}
function renderWeather(c){
  if(wx){
    const code = wx.weather_code;
    const desc = WMO[code] ? (isZh()?WMO[code][0]:WMO[code][1]) : '—';
    $('wxIcon').textContent = wxIcon(code);
    $('wxTemp').textContent = `${wx.temperature_2m.toFixed(1)}°C`;
    const extra = isZh()
      ? `${desc} · 体感 ${wx.apparent_temperature.toFixed(1)}° · 湿度 ${wx.relative_humidity_2m}% · 风 ${wx.wind_speed_10m} km/h`
      : `${desc} · feels ${wx.apparent_temperature.toFixed(1)}° · humidity ${wx.relative_humidity_2m}% · wind ${wx.wind_speed_10m} km/h`;
    $('wxNote').textContent = extra;
    $('localTime').textContent = localClock(c.tz,false);
  }else{
    $('wxIcon').textContent='◌'; $('wxTemp').textContent='—';
    t($('wxNote'),'天气暂不可用','Weather unavailable');
  }
  $('localDate').textContent = localClock(c.tz, true);
  if(sun && sun.sunrise && sun.sunset){
    $('sunTime').textContent = `${sun.sunrise[0].slice(11,16)} / ${sun.sunset[0].slice(11,16)}`;
    t($('sunNote'),'日出 / 日落（当地）','Sunrise / sunset (local)');
  }else{
    $('sunTime').textContent='—'; t($('sunNote'),'日照数据暂不可用','Sun data unavailable');
  }
}

/* ---------- 句子 ---------- */
function linesOf(c){ return (c.lines && c.lines.length) ? c.lines : []; }
function renderQuote(c){
  const lines = linesOf(c);
  if(!lines.length){ $('quoteText').textContent='—'; $('quoteCount').textContent='0/0'; return; }
  if(quoteIndex>=lines.length) quoteIndex=0;
  if(quoteIndex<0) quoteIndex=lines.length-1;
  const ln = lines[quoteIndex];
  $('quoteKind').textContent = isZh()?ln.kindZh:ln.kindEn;
  $('quoteText').textContent = isZh()?ln.zh:ln.en;
  $('quoteAuthor').textContent = '— ' + (isZh()?ln.byZh:ln.byEn);
  $('quoteCount').textContent = `${quoteIndex+1}/${lines.length}`;
  // 双语：中文界面下英文句附于下方；英文界面下中文原文附于下方（不同句时）
  if(isZh() && ln.zh!==ln.en){
    $('quoteEn').textContent = ln.en; $('quoteEn').hidden=false;
  }else if(!isZh() && ln.zh!==ln.en){
    $('quoteEn').textContent = ln.zh; $('quoteEn').hidden=false;
  }else{
    $('quoteEn').hidden=true;
  }
  const many = lines.length>1;
  $('quotePrev').style.display = many?'flex':'none';
  $('quoteNext').style.display = many?'flex':'none';
}
$('quotePrev').onclick = ()=>{ quoteIndex--; renderQuote(current); };
$('quoteNext').onclick = ()=>{ quoteIndex++; renderQuote(current); };

/* ---------- 主体渲染 ---------- */
function render(){
  const c = current;
  applyStaticLang();
  $('coord').textContent = fmtCoord(c);
  $('kicker').textContent = isZh() ? '城市图鉴 · CITY SIGN' : 'THE CITY · CITY SIGN';
  $('issue').textContent = issueNo(c, new Date());

  const country = isZh() ? c.countryZh : c.countryEn;
  const place = isZh()
    ? `${c.continent} · ${c.region} · ${country}`
    : `${c.countryEn} · ${c.regionEn} · ${c.continentEn}`;
  $('cityName').textContent = isZh() ? c.zh : c.en;
  $('cityEn').textContent = isZh() ? c.en : c.zh;
  $('citySub').textContent = `${place}　|　${isZh()?c.nickname:c.en}`;

  const facts = [
    [isZh()?'位置 · LOCATION':'LOCATION', isZh()?`${country} · ${c.region}`:`${country} · ${c.regionEn}`],
    [isZh()?'人口 · POPULATION':'POPULATION', fmtPop(c)],
    [isZh()?'面积 · AREA':'AREA', fmtArea(c)],
    [isZh()?'气候 · CLIMATE':'CLIMATE', isZh()?c.climate:c.climateEn],
    [isZh()?'半球 · HEMISPHERE':'HEMISPHERE', hemi(c)],
    [isZh()?'时区 · TIME ZONE':'TIME ZONE', `${c.tz} · ${offsetOf(c.tz)}`],
  ];
  $('facts').innerHTML = facts.map(([k,v])=>
    `<div><p class="fact-l">${k}</p><p class="fact-v">${v}</p></div>`).join('');

  $('sights').innerHTML = (isZh()?c.landmarks:c.landmarksEn).slice(0,3)
    .map(x=>`<span class="tag">${x}</span>`).join('');
  $('foods').innerHTML = (isZh()?c.foods.zh:c.foods.en).slice(0,3)
    .map(x=>`<span class="tag food">${x}</span>`).join('');

  renderMap(c);
  renderQuote(c);

  setImage(c);
  clearInterval(localTimeTimer);
  localTimeTimer = setInterval(()=>{
    $('localTime').textContent = localClock(c.tz,false);
    $('localDate').textContent = localClock(c.tz,true);
  }, 30000);
  fetchWeather(c);
}
let localTimeTimer = null;
function selectCity(id){
  const c = CITIES.find(x=>x.id===id);
  if(!c) return;
  current = c; quoteIndex=0;
  wx=null; sun=null;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

$('exportBtn').onclick = (e)=>{ e.stopPropagation(); $('exportPop').hidden=!$('exportPop').hidden; };
$('expPdf').onclick = ()=>{ $('exportPop').hidden=true; window.print(); };
function dataURL(url){
  return new Promise((resolve,reject)=>{
    fetch(url).then(r=>r.blob()).then(b=>{
      const fr=new FileReader();
      fr.onload=()=>resolve(fr.result); fr.onerror=reject; fr.readAsDataURL(b);
    }).catch(reject);
  });
}
function download(href, name){
  const a=document.createElement('a'); a.href=href; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}
function safeName(){ return `城签-${current.zh.replace(/[·\s]/g,'')}-${new Date().toISOString().slice(0,10)}`; }

$('expHtml').onclick = async ()=>{
  $('exportPop').hidden=true;
  toast(isZh()?'正在生成单文件 HTML…':'Building standalone HTML…');
  try{
    const clone = document.documentElement.cloneNode(true);
    // 内嵌当前实景图为 base64
    const img = clone.querySelector('#heroImg');
    if(img){ try{ img.src = await dataURL(`assets/cities/${current.id}.jpg`); }catch(e){} }
    // 内嵌地图 SVG 已随 DOM 存在；移除控制条、提示、toast 与脚本
    const bar=clone.querySelector('.toolbar'); if(bar) bar.remove();
    const hint=clone.querySelector('.hint'); if(hint) hint.remove();
    const toastEl=clone.querySelector('#toast'); if(toastEl) toastEl.remove();
    const skinBtn=clone.querySelector('#skinBtn'); if(skinBtn) skinBtn.remove();
    const qnav=clone.querySelector('.quote-nav'); if(qnav) qnav.remove();
    clone.querySelectorAll('script').forEach(s=>s.remove());
    // 冻结皮肤到当前 class（已在 DOM 的 hero class 上）
    const html='<!DOCTYPE html>\n'+clone.outerHTML;
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    download(url, safeName()+'.html');
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast(isZh()?'已导出单文件 HTML':'Standalone HTML exported');
  }catch(e){ toast(isZh()?'导出失败：'+e.message:'Export failed: '+e.message); }
};

/* 纯 canvas 手绘海报，规避 foreignObject + 图片导致的 canvas 污染 */
function loadImage(src){
  return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; });
}
function wrapText(ctx, text, x, y, maxW, lineH, maxLines){
  const chars=[...text]; let line='', lines=[];
  for(const ch of chars){
    if(ctx.measureText(line+ch).width>maxW && line){ lines.push(line); line=ch; }
    else line+=ch;
  }
  if(line) lines.push(line);
  if(maxLines && lines.length>maxLines){ lines=lines.slice(0,maxLines); lines[maxLines-1]=lines[maxLines-1].slice(0,-1)+'…'; }
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));
  return lines.length;
}
$('expPng').onclick = async ()=>{
  $('exportPop').hidden=true;
  toast(isZh()?'正在生成 PNG…':'Rendering PNG…');
  try{
    const c = current;
    const W=760, H=1120, S=2;
    const canvas=document.createElement('canvas');
    canvas.width=W*S; canvas.height=H*S;
    const ctx=canvas.getContext('2d'); ctx.scale(S,S);
    const FONT='"PingFang SC","Microsoft YaHei","Microsoft YaHei UI",sans-serif';
    const SERIF='"Songti SC","SimSun",Georgia,serif';

    // 背景
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);

    // 头图
    const heroH=360;
    let hero=null;
    try{ hero=await loadImage(`assets/cities/${c.id}.jpg`); }catch(e){}
    if(hero){
      // cover 裁切
      const iw=hero.width, ih=hero.height;
      const scale=Math.max(W/iw, heroH/ih);
      const dw=iw*scale, dh=ih*scale;
      ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,heroH); ctx.clip();
      ctx.drawImage(hero,(W-dw)/2,(heroH-dh)/2,dw,dh);
      // 皮肤滤镜（用半透明色层模拟）
      const skin=$('hero').dataset.skin||'';
      const tints={'skin-warm':'rgba(200,140,60,.16)','skin-cool':'rgba(60,90,140,.20)',
        'skin-dusk':'rgba(120,60,40,.28)','skin-night':'rgba(10,20,50,.48)',
        'skin-film':'rgba(90,80,70,.22)','skin-vivid':'rgba(255,180,80,.06)',
        'skin-dawn':'rgba(255,220,170,.16)'};
      if(tints[skin]){ ctx.fillStyle=tints[skin]; ctx.fillRect(0,0,W,heroH); }
      // 渐变遮罩
      const g=ctx.createLinearGradient(0,0,0,heroH);
      g.addColorStop(0,'rgba(20,24,27,.38)'); g.addColorStop(.4,'rgba(20,24,27,.02)');
      g.addColorStop(.72,'rgba(20,24,27,.12)'); g.addColorStop(1,'rgba(20,24,27,.70)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,heroH);
      ctx.restore();
    }else{
      ctx.fillStyle='#8fa3ad'; ctx.fillRect(0,0,W,heroH);
    }
    // 坐标 chip
    ctx.font=`12px ${FONT}`;
    const coordTxt=fmtCoord(c);
    const cw=ctx.measureText(coordTxt).width+22;
    ctx.fillStyle='rgba(20,24,27,.5)';
    roundRect(ctx,20,20,cw,30,15); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.fillText(coordTxt,31,40);
    // 期号
    ctx.textAlign='right'; ctx.fillStyle='rgba(255,255,255,.85)'; ctx.font=`11px ${SERIF}`;
    ctx.fillText('No.'+c.id.slice(0,3).toUpperCase()+'-'+new Date().toISOString().slice(0,10).replace(/-/g,''),W-22,39);
    ctx.textAlign='left';
    // 城市名
    ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font=`11px ${FONT}`;
    ctx.fillText(isZh()?'城市图鉴 · CITY SIGN':'THE CITY · CITY SIGN',28,heroH-92);
    ctx.fillStyle='#fff'; ctx.font=`bold 46px ${SERIF}`;
    const name=isZh()?c.zh:c.en;
    ctx.fillText(name,26,heroH-42);
    const nameW=ctx.measureText(name).width;
    const enName=isZh()?c.en:c.zh;
    ctx.font=`19px ${SERIF}`;
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.fillText(enName, 26+nameW+16, heroH-42);
    ctx.font=`12px ${FONT}`; ctx.fillStyle='rgba(255,255,255,.9)';
    const place=isZh()?`${c.continent} · ${c.region} · ${c.countryZh}`:`${c.countryEn} · ${c.regionEn} · ${c.continentEn}`;
    ctx.fillText(place+'　|　'+(isZh()?c.nickname:c.en),28,heroH-20);

    let y=heroH+26;
    // 天气条
    ctx.fillStyle='#fbf9f4'; ctx.strokeStyle='#e6e2da'; ctx.lineWidth=1;
    roundRect(ctx,26,y,W-52,84,12); ctx.fill(); ctx.stroke();
    const cellW=(W-52)/3;
    const cells=[
      [isZh()?'此刻天气':'WEATHER', wx?`${wx.temperature_2m.toFixed(1)}°C`:'—'],
      [isZh()?'当地时间':'LOCAL TIME', localClock(c.tz,false)],
      [isZh()?'今日日照':'SUN TODAY', sun?`${sun.sunrise[0].slice(11,16)} / ${sun.sunset[0].slice(11,16)}`:'—']
    ];
    cells.forEach((cl,i)=>{
      const cx=26+i*cellW;
      if(i>0){ ctx.strokeStyle='#e6e2da'; ctx.beginPath(); ctx.moveTo(cx,y+12); ctx.lineTo(cx,y+72); ctx.stroke(); }
      ctx.textAlign='center';
      ctx.fillStyle='#9aa1a7'; ctx.font=`10px ${FONT}`; ctx.fillText(cl[0],cx+cellW/2,y+26);
      ctx.fillStyle='#23282d'; ctx.font=`bold 21px ${FONT}`; ctx.fillText(cl[1],cx+cellW/2,y+56);
      ctx.textAlign='left';
    });
    y+=84+24;

    // 世界位置地图
    sectionTitle(ctx,isZh()?'世界位置 · WHERE ON EARTH':'WHERE ON EARTH',26,y); y+=22;
    ctx.fillStyle='#fbf9f4'; ctx.strokeStyle='#e6e2da';
    roundRect(ctx,26,y,W-52,132,12); ctx.fill(); ctx.stroke();
    // 点阵地图缩绘
    const mb={x:34,y:y+8,w:250,h:100};
    ctx.save(); roundRect(ctx,mb.x,mb.y,mb.w,mb.h,6); ctx.clip();
    ctx.fillStyle='#f3f1ea'; ctx.fillRect(mb.x,mb.y,mb.w,mb.h);
    const sxx=mb.w/MAP.w, syy=mb.h/MAP.h;
    ctx.fillStyle='#a9553d';
    // 用点阵：解析 MAP.dots 的 M/h/v/z 生成小方块
    drawMapDots(ctx,MAP.dots,mb.x,mb.y,sxx,syy,'#8f9c92');
    const mx=mb.x+(c.lon+180)*sxx, my=mb.y+(MAP.top-c.lat)*syy;
    ctx.strokeStyle='#a9553d'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(mx,mb.y); ctx.lineTo(mx,mb.y+mb.h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mb.x,my); ctx.lineTo(mb.x+mb.w,my); ctx.stroke();
    ctx.beginPath(); ctx.arc(mx,my,4,0,7); ctx.stroke();
    ctx.fillStyle='#a9553d'; ctx.beginPath(); ctx.arc(mx,my,2,0,7); ctx.fill();
    ctx.fillStyle='#5d7568'; ctx.font=`bold 10px ${FONT}`; ctx.fillText(offsetOf(c.tz),mb.x+5,mb.y+mb.h-5);
    ctx.restore();
    // 地图右侧信息
    const ix=mb.x+mb.w+18;
    ctx.fillStyle='#9aa1a7'; ctx.font=`10px ${FONT}`;
    ctx.fillText(isZh()?'经纬度 · COORDINATES':'COORDINATES',ix,y+30);
    ctx.fillStyle='#23282d'; ctx.font=`14px ${FONT}`; ctx.fillText(fmtCoord(c),ix,y+52);
    ctx.fillStyle='#9aa1a7'; ctx.font=`10px ${FONT}`;
    ctx.fillText(isZh()?'时区 · TIME ZONE':'TIME ZONE',ix,y+78);
    ctx.fillStyle='#5d7568'; ctx.font=`12px ${FONT}`; ctx.fillText(`${c.tz} · ${offsetOf(c.tz)}`,ix,y+98);
    y+=132+22;

    // 城市档案
    sectionTitle(ctx,isZh()?'城市档案 · CITY FACTS':'CITY FACTS',26,y); y+=20;
    const facts=[
      [isZh()?'位置':'LOCATION', isZh()?`${c.countryZh} · ${c.region}`:`${c.countryEn} · ${c.regionEn}`],
      [isZh()?'人口':'POPULATION', fmtPop(c)],
      [isZh()?'面积':'AREA', fmtArea(c)],
      [isZh()?'气候':'CLIMATE', isZh()?c.climate:c.climateEn],
      [isZh()?'半球':'HEMISPHERE', hemi(c)],
      [isZh()?'时区':'TIME ZONE', offsetOf(c.tz)],
    ];
    facts.forEach((f,i)=>{
      const col=i%3, row=Math.floor(i/3);
      const fx=26+col*((W-52)/3), fy=y+row*46;
      ctx.fillStyle='#9aa1a7'; ctx.font=`10.5px ${FONT}`; ctx.fillText(f[0],fx,fy);
      ctx.fillStyle='#23282d'; ctx.font=`13px ${FONT}`; ctx.fillText(f[1],fx,fy+20);
    });
    y+=2*46+16;

    // 地标与风味
    sectionTitle(ctx,isZh()?'地标与风味 · SIGHTS & FLAVOURS':'SIGHTS & FLAVOURS',26,y); y+=20;
    y=drawTags(ctx,(isZh()?c.landmarks:c.landmarksEn).slice(0,3),26,y,'#fbf9f4','#23282d');
    y=drawTags(ctx,(isZh()?c.foods.zh:c.foods.en).slice(0,3),26,y+2,'#f6f1e9','#8a6a3f');
    y+=16;

    // 句子
    const lines=linesOf(c);
    const ln=lines[quoteIndex]||{zh:'—',en:'—',kindZh:'',kindEn:'',byZh:'',byEn:''};
    const qh=112;
    ctx.fillStyle='#faf6f0';
    roundRect(ctx,26,y,W-52,qh,10); ctx.fill();
    ctx.fillStyle='#a9553d'; ctx.fillRect(26,y+10,3,qh-20);
    ctx.fillStyle='#a9553d'; ctx.font=`10px ${FONT}`;
    const kind=isZh()?ln.kindZh:ln.kindEn;
    ctx.fillText('〔'+kind+'〕',42,y+32);
    ctx.fillStyle='#3b342c'; ctx.font=`16px ${SERIF}`;
    const qtext=isZh()?ln.zh:ln.en;
    wrapText(ctx,qtext,42,y+58,W-52-32,24,2);
    ctx.fillStyle='#6d747b'; ctx.font=`11px ${FONT}`;
    ctx.fillText('— '+(isZh()?ln.byZh:ln.byEn),42,y+qh-16);
    y+=qh+20;

    canvas.toBlob(b=>{
      if(b){ const u=URL.createObjectURL(b); download(u, safeName()+'.png');
        setTimeout(()=>URL.revokeObjectURL(u),4000); toast(isZh()?'已导出 PNG':'PNG exported'); }
      else toast(isZh()?'PNG 生成失败':'PNG failed');
    },'image/png');
  }catch(e){ toast(isZh()?'导出失败：'+e.message:'Export failed: '+e.message); }
};
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function sectionTitle(ctx,text,x,y){
  ctx.fillStyle='#a9553d'; ctx.font=`bold 11px "${'PingFang SC'},sans-serif"`;
  ctx.fillText(text,x,y);
  const tw=ctx.measureText(text).width;
  ctx.strokeStyle='#e6e2da'; ctx.beginPath(); ctx.moveTo(x+tw+10,y-4); ctx.lineTo(734,y-4); ctx.stroke();
}
function drawTags(ctx,arr,x,y,bg,fg){
  let cx=x;
  arr.forEach(a=>{
    ctx.font=`12px "${'PingFang SC'},sans-serif"`;
    const tw=ctx.measureText(a).width, bw=tw+22;
    if(cx+bw>734){ cx=x; y+=32; }
    ctx.fillStyle=bg; roundRect(ctx,cx,y-13,bw,26,13); ctx.fill();
    ctx.strokeStyle='#e6e2da'; ctx.stroke();
    ctx.fillStyle=fg; ctx.fillText(a,cx+11,y+4);
    cx+=bw+8;
  });
  return y+34;
}
function drawMapDots(ctx,pathStr,ox,oy,sx,sy,color){
  ctx.fillStyle=color;
  // 解析 "M x y h2.4v2.4h-2.4z" 重复
  const re=/M([\d.-]+) ([\d.-]+)h2\.4v2\.4h-2\.4z/g;
  let m;
  while((m=re.exec(pathStr))!==null){
    const x=ox+parseFloat(m[1])*sx, y=oy+parseFloat(m[2])*sy;
    ctx.fillRect(x,y,Math.max(1,2.4*sx),Math.max(1,2.4*sy));
  }
}

applyStaticLang();
render();
setInterval(()=>fetchWeather(current), 10*60*1000);
</script>
